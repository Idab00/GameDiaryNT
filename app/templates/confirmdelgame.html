{% extends 'index.html' %}

{% block content %}

<h1 class="text-warning">Delete Game</h1>

<div class="card border-warning mb-3" style="width: 50rem;">
    <div class="card-body">
        <h3 class="card-title text-warning">Confirm the removal of game</h3>
        <h5 class="card-text text-danger">Game: {{game.gametitle}}</h5>

        <a href="/allgames/" class="btn btn-warning">Cancel</a>
        <a href="/delete-game/{{game.id}}" class="btn btn-danger">Delete</a>

    </div>
</div>

{% endblock %}
