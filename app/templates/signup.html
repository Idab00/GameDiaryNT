{% extends 'index.html' %}

{% block content %}

<h1>SignUp</h1>

{% if error %}
<div class="alert alert-danger">
    {{ error }}
</div>
{% endif %}

<div class="container">
    <div class="card" style="width: 25rem; margin-top: 50px;">
        <div class="card-header">
            <div class="card-body">
                <form id="myForm" method="post" action="/signup-post/">
                    {%csrf_token %}
                    <div class="form-group">
                        <label>Username</label>
                        <input autofocus class="form-control" type="text" name="username">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input class="form-control" type="email" name="email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input class="form-control" type="password" name="password">
                    </div>
                    <div class="form-group">
                        <label>Confirm password</label>
                        <input class="form-control" type="password" name="password2">
                    </div>
                    <input type="submit" value="Register" class="btn btn-success btn-sm">
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
