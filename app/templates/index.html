<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/vapor/bootstrap.min.css">

    <title>GameDiary</title>
</head>
<body>
    <div class="container-fluid">
        <center>
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">GameDiary</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarColor01">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="/">Home
                                <span class="visually-hidden">(current)</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/allgames">All games</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/mylibrary">My library</a>
                        </li>
                    </ul>
                    <div class="btn-group" role="group">
                        <a class="btn btn-primary" href="/signup">Signup</a>
                        <a class="btn btn-light">Login</a>
                        <a class="btn btn-light">Logout</a>
                        <a class="btn btn-light" href="/admin">Admin page</a>
                    </div>
                </div>
            </div>
        </nav>
        {% block content %}
        
        {% endblock %}
    </center>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
