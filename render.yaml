databases:
  - name: gamediary_db
    plan: free
    databaseName: GameDiary
    user: ida

services:
  - type: web
    plan: free
    name: GameDiary
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn GameDiary.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gamediary_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_SUPERUSER_USERNAME
        value: "ida"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "JLZminx#71"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "super@upersuper.fi"